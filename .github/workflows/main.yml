name: Build Project
run-name: MajdataPlay build

on:
  push:
    branches: [ "dev", "main", "xcode_build", "test_workflow", "github-ci"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 2022.3.62f3

jobs:
  build:
    name: Build (Windows/Linux)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [StandaloneWindows64, StandaloneLinux64]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-
    
      - name: List files in project directory
        run: ls -laR || true

      - name: Build (Release)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: List files in build directory
        run: ls -R ${{ env.CONFIGURATION }} || true

      - name: Package output as zip
        if: ${{ env.TARGET_PLATFORM != 'Android' }}
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP_NAME="MajdataPlay-${{ env.TARGET_PLATFORM }}-nightly.zip"
          (cd "${{ env.CONFIGURATION }}" && zip -qry "../out/${ZIP_NAME}" .)
          ls -la out

      - name: Upload build outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.TARGET_PLATFORM }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [Android]
        channel: [foss,play]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_CHANNEL: ${{ matrix.channel }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: List files in project directory
        run: ls -laR || true

      - name: Build APKs (Release)
        if: ${{ env.TARGET_CHANNEL == 'foss' }}
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: Build AAB (Release)
        if: ${{ env.TARGET_CHANNEL == 'play' }}
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}
          androidExportType: 'androidAppBundle'
          androidTargetSdkVersion: android-36
          androidKeystoreName: android-publish.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }} 
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }} 
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }} 
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: List files in project directory
        run: ls -laR || true

      - name: Collect Android APKs
        if: ${{ env.TARGET_CHANNEL == 'foss' }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ env.CONFIGURATION }}/Android/MajdataPlay.apk/MajdataPlay.armeabi-v7a.apk" "out/MajdataPlay-Android-nightly.armeabi-v7a.apk"
          cp "${{ env.CONFIGURATION }}/Android/MajdataPlay.apk/MajdataPlay.arm64-v8a.apk" "out/MajdataPlay-Android-nightly.arm64-v8a.apk"
          ls -la out
          
      - name: Collect Android AAB
        if: ${{ env.TARGET_CHANNEL == 'play' }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ env.CONFIGURATION }}/Android/MajdataPlay.aab" "out/MajdataPlay-Android-nightly.aab"
          ls -la out

      - name: Upload build outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.TARGET_PLATFORM }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  build-apple:
    name: Build (macOS/iOS)
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [StandaloneOSX, iOS]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: Build (Release)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: List files in build directory
        run: ls -R ${{ env.CONFIGURATION }} || true

      - name: Archive iOS (xcarchive)
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -e
          PROJECT_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcodeproj"
          ARCHIVE_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcarchive"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "Unity-iPhone" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA from xcarchive
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcarchive"
          EXPORT_DIR="${{ env.CONFIGURATION }}/iOS/MajdataPlay/export-ipa"
          mkdir -p "$EXPORT_DIR"

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $ARCHIVE_PATH/Products/Applications"
            ls -la "$ARCHIVE_PATH/Products/Applications" || true
            exit 1
          fi

          rm -rf "$EXPORT_DIR/Payload"
          mkdir -p "$EXPORT_DIR/Payload"
          cp -R "$APP_PATH" "$EXPORT_DIR/Payload/"

          IPA_PATH="$EXPORT_DIR/MajdataPlay-iOS-nightly.ipa"
          (cd "$EXPORT_DIR" && /usr/bin/zip -qry "$(basename "$IPA_PATH")" Payload)
          ls -la "$EXPORT_DIR"

      - name: Package macOS output as zip
        if: ${{ env.TARGET_PLATFORM == 'StandaloneOSX' }}
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP_NAME="MajdataPlay-StandaloneOSX-nightly.zip"
          (cd "${{ env.CONFIGURATION }}" && zip -qry "../out/${ZIP_NAME}" .)
          ls -la out

      - name: Collect iOS IPA to out
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ env.CONFIGURATION }}/iOS/MajdataPlay/export-ipa/MajdataPlay-iOS-nightly.ipa" out/
          ls -la out

      - name: Upload build outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.TARGET_PLATFORM }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish-nightly:
    name: Publish nightly release (replace only after all builds succeed)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [build, build-android, build-apple]

    steps:
      - name: Checkout (for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Show collected files
        run: |
          set -euo pipefail
          ls -R collected || true

      - name: Move nightly tag to this commit (only after builds succeed)
        run: |
          set -e
          git tag -f nightly "${GITHUB_SHA}"
          git push origin -f nightly

      - name: Delete old nightly release (if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly -y
          else
            echo "No existing nightly release."
          fi

      - name: Create new nightly release with notes (UTC+8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUILD_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          NOTES_FILE="$(mktemp)"

          printf "Automated nightly build.\nCommit: %s\nBuild at: %s (UTC+8)\n" \
            "${GITHUB_SHA}" \
            "${BUILD_AT}" \
            > "${NOTES_FILE}"

          gh release create nightly \
            --title "Nightly" \
            --notes-file "${NOTES_FILE}" \
            --latest

      - name: Upload all artifacts to the new nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # collected/<artifact-name>/<files...>
          gh release upload nightly collected/**/* --clobber
