name: Build Project
run-name: MajdataPlay build

on:
  push:
    branches: [ "beta1.0", "main" ,"xcode_build"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 2022.3.62f3

jobs:
  prepare-nightly:
    name: Prepare nightly tag & release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout (for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move nightly tag to this commit
        run: |
          set -e
          git tag -f nightly "${GITHUB_SHA}"
          git push origin -f nightly

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly \
              --title "Nightly" \
              --notes "Automated nightly build. Commit: ${GITHUB_SHA}" \
              --latest
          else
            gh release edit nightly \
              --title "Nightly" \
              --notes "Automated nightly build. Commit: ${GITHUB_SHA}" \
              --latest
          fi

  build:
    name: Build & Upload (Windows/Linux/Android)
    runs-on: ubuntu-latest
    needs: [prepare-nightly]
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [StandaloneWindows64, StandaloneLinux64, Android]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: Build (Release)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: List files in build directory
        run: ls -R ${{ env.CONFIGURATION }} || true

      - name: Package output (non-Android) as zip
        if: ${{ env.TARGET_PLATFORM != 'Android' }}
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP_NAME="MajdataPlay-${{ env.TARGET_PLATFORM }}-nightly.zip"
          (cd "${{ env.CONFIGURATION }}" && zip -qry "../out/${ZIP_NAME}" .)
          ls -la out

      - name: Collect Android APKs
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ env.CONFIGURATION }}/Android/MajdataPlay.apk/MajdataPlay.armeabi-v7a.apk" "out/MajdataPlay-Android-nightly.armeabi-v7a.apk"
          cp "${{ env.CONFIGURATION }}/Android/MajdataPlay.apk/MajdataPlay.arm64-v8a.apk" "out/MajdataPlay-Android-nightly.arm64-v8a.apk"
          ls -la out

      - name: Upload to nightly release (overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload nightly out/* --clobber

  build-apple:
    name: Build & Upload (macOS/iOS)
    runs-on: macos-latest
    needs: [prepare-nightly]
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [StandaloneOSX, iOS]

    env:
      CONFIGURATION: ${{ matrix.configuration }}
      TARGET_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: Build (Release)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Semantic
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: List files in build directory
        run: ls -R ${{ env.CONFIGURATION }} || true

      - name: Archive iOS (xcarchive)
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -e
          PROJECT_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcodeproj"
          ARCHIVE_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcarchive"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "Unity-iPhone" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA from xcarchive
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcarchive"
          EXPORT_DIR="${{ env.CONFIGURATION }}/iOS/MajdataPlay/export-ipa"
          mkdir -p "$EXPORT_DIR"

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $ARCHIVE_PATH/Products/Applications"
            ls -la "$ARCHIVE_PATH/Products/Applications" || true
            exit 1
          fi

          rm -rf "$EXPORT_DIR/Payload"
          mkdir -p "$EXPORT_DIR/Payload"
          cp -R "$APP_PATH" "$EXPORT_DIR/Payload/"

          IPA_PATH="$EXPORT_DIR/MajdataPlay-iOS-nightly.ipa"
          (cd "$EXPORT_DIR" && /usr/bin/zip -qry "$(basename "$IPA_PATH")" Payload)
          ls -la "$EXPORT_DIR"

      - name: Package macOS output as zip
        if: ${{ env.TARGET_PLATFORM == 'StandaloneOSX' }}
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP_NAME="MajdataPlay-StandaloneOSX-nightly.zip"
          (cd "${{ env.CONFIGURATION }}" && zip -qry "../out/${ZIP_NAME}" .)
          ls -la out

      - name: Collect iOS IPA to out
        if: ${{ env.TARGET_PLATFORM == 'iOS' }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${{ env.CONFIGURATION }}/iOS/MajdataPlay/export-ipa/MajdataPlay-iOS-nightly.ipa" out/
          ls -la out

      - name: Upload to nightly release (overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload nightly out/* --clobber
